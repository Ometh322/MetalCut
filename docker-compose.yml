services:
  db:
    image: postgres:16-alpine
    container_name: metalcut-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: metalcut
      POSTGRES_PASSWORD: metalcut
      POSTGRES_DB: metalcut
    ports:
      # 5432 на хосте часто занят нативным Postgres — наш контейнер наружу на 5433
      - "5433:5432"
    volumes:
      - metalcut-pgdata:/var/lib/postgresql/data

volumes:
  metalcut-pgdata:
